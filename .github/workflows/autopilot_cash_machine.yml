name: Autonomous 24/7 Trend Earning & Reel Production Engine

on:
  schedule:
    - cron: '0 */4 * * *'  # Runs automatically every 4 hours on 100% Free GitHub Cloud
  workflow_dispatch:       # Allows 1-click manual trigger from GitHub phone app / web

jobs:
  run-autopilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install System Dependencies & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow requests urllib3

      - name: Execute High-Profit Fashion Video Production Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EARNKARO_USER_ID: ${{ secrets.EARNKARO_USER_ID }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python -m pipeline.high_profit_fashion_autopilot --category combo
