name: Deploy Dashboard

# Publishes the analytics dashboard (+ llms.txt files) to GitHub Pages.
# Runs after each content run and on manual dispatch.
on:
  workflow_run:
    workflows: ["Daily Content"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Pull the latest run artifacts so the dashboard reflects real data.
      - name: Download latest run data
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: daily-content.yml
          name_is_regexp: true
          name: run-.*
          path: data/runs
          if_no_artifact_found: warn
        continue-on-error: true

      - name: Build dashboard
        run: |
          python dashboard.py --refresh 60
          mkdir -p _site
          cp data/dashboard.html _site/index.html
          mkdir -p _site/llms
          cp -r data/llms/* _site/llms/ 2>/dev/null || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
